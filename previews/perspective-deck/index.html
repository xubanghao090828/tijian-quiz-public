<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121419"><title>卡堆抽取 · 独立动画原型</title><link rel="stylesheet" href="perspective-deck.css"><link rel="stylesheet" href="demo.css"></head>
<body>
<main>
  <header><div class="eyebrow">MOTION STUDY / NATIVE WEB ANIMATIONS</div><h1>从后方，弹到眼前。</h1><p>四层卡堆 · 底部抽取 · 弹性回位</p></header>
  <section class="stage" aria-label="卡堆动画演示"><div id="deck"></div><div class="deck-caption"><span id="phase">稳定堆叠</span><span id="order">前 → 后：A B C D</span></div></section>
  <div class="actions"><button id="shuffle" class="primary">抽出后卡</button><button id="auto" aria-pressed="true">自动循环：开</button><button id="pause">暂停</button></div>
  <p class="hint" id="hint" role="status">点击卡堆也可切换，连续点击最多排队一次。</p>
  <details class="settings"><summary>参数与逐帧检查</summary><div class="settings-body">
    <label>卡片间距 <output id="gap-value">22 px</output><input id="gap" type="range" min="10" max="36" value="22"></label>
    <label>每层缩放差 <output id="scaleStep-value">0.08</output><input id="scaleStep" type="range" min="0.04" max="0.12" step="0.01" value="0.08"></label>
    <label>单次时长 <output id="duration-value">700 ms</output><input id="duration" type="range" min="400" max="1400" step="50" value="700"></label>
    <label>弹性 <output id="elasticity-value">0.55</output><input id="elasticity" type="range" min="0" max="1" step="0.05" value="0.55"></label>
    <label class="scrub-label">检查动画进度 <output id="seek-value">0%</output><input id="seek" type="range" min="0" max="1000" step="1" value="0"></label>
    <div class="tools"><button id="reset">回到初始堆叠</button><button id="stress">快速点击 12 次</button><button id="measure">测量流畅度</button></div>
    <p id="performance" class="diagnostic">测量会记录前台浏览器帧间隔，供当前设备核对。</p>
    <p class="diagnostic">实际卡片比例：1.00 / 0.92 / 0.84 / 0.76。参数改变会在当前动画落定后生效。</p>
  </div></details>
  <footer>独立组件原型 · 未接入正式刷题界面 · <a href="README.md">组件说明与调研</a></footer>
</main>
<script type="module" src="demo.js"></script>
</body></html>
